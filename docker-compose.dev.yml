services:
  frontend:
    build:
      context: ./client/Guest/my-auth-app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./client/Guest/my-auth-app:/app
    environment:
      - NODE_ENV=development

  admin-frontend: 
      build:
        context: ./client/Admin
        dockerfile: Dockerfile.dev
      ports:
        - "5174:5174"
      volumes:
        - ./client/Admin:/app
        - /app/node_modules
      environment:
        - NODE_ENV=development

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - ./server/modules/eighth-parity-474012-a2-e43b626c3437.json:/app/modules/eighth-parity-474012-a2-e43b626c3437.json
    environment:
      - NODE_ENV=development
      - GOOGLE_APPLICATION_CREDENTIALS=/app/modules/eighth-parity-474012-a2-e43b626c3437.json

